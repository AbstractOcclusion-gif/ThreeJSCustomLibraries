<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>three-kit | Valley with Pond and Lake</title>
</head>
<body>
<header><div><small>THREE-KIT / TERRAIN</small><h1>Valley with Pond and Lake</h1></div><a href="../">All modules</a></header>
<aside>
<p class="intro">Choose Pond or Lake, then click or drag on the water to make ripples. Use Flyover to inspect the shoreline.</p>
<details open>
<summary>Terrain textures</summary>
<p><label>Layer <select id="texture-layer"></select></label></p>
<p><label>Set <select id="texture-set"></select></label></p>
<p><label>Map <select id="texture-map"></select></label></p>
<img id="texture-preview" width="132" height="132" alt="">
<div class="buttons"><button id="texture-apply" type="button">Apply to valley</button><a id="texture-source" target="_blank" rel="noopener">CC0 source</a></div>
<p id="texture-status" role="status"></p>
</details>
<div id="status" role="status"></div><div id="error" role="alert" hidden></div>
</aside>
<script type="module" src="./main.js"></script>
</body>
</html>
