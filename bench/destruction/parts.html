<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destruction catalogue</title>
<style>
[hidden]{display:none!important}body{overflow:hidden;margin:0;background:#15212a;color:#eee;font:15px system-ui}canvas{display:block}main{position:fixed;top:16px;left:16px;max-width:300px;padding:18px;background:#15212aee;border:1px solid #50616c;border-radius:10px}h1{font-size:22px;margin:0 0 12px}label{display:block;margin:10px 0}select{max-width:100%;width:100%}input{width:60px}button,select,input{font:inherit;padding:7px;border-radius:5px;border:1px solid #70808a;background:#263947;color:#fff}button{margin:4px 3px 4px 0;cursor:pointer}p{line-height:1.4}a{color:#aad6e8}#status{max-width:380px;font-size:13px}small{color:#b7c4cc}
</style></head><body><button id="toggle-controls" type="button" aria-controls="part-controls" aria-expanded="true">Hide controls</button><main id="part-controls"><h1>Destruction catalogue</h1><label>Part <select id="part" aria-label="Part"></select></label><label>Variant seed <input id="seed" type="number" min="0" step="1" value="1"></label><button id="reset">Rebuild</button><button id="drop">Drop 350 kg</button><button id="release">Release supports</button><label><input id="surfaces" type="checkbox" checked> Realistic surfaces</label><label id="facadeControl" hidden><input id="facade" type="checkbox" checked> Facade layer</label><label id="descent" hidden>Player height <input id="playerY" type="number" step="5" value="0"> m <small id="bandStats"></small></label><p id="status" role="status">Loading catalogue…</p><small>Click anywhere to fire a ball. Drag to orbit.<br>Brick/stone: hit standing wall, then hit a falling chunk again.<br>Lower Player height to remove upper rubble bands.<br>Gameplay material values; visual response needs playtest.</small><p><a href="./">Pratt bridge</a></p></main><script type="module" src="./parts.js"></script></body></html>
